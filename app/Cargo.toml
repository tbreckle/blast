[package]
name = "blast"
version = "0.0.0"
edition = "2021"

[package.metadata.msc]
subsystem = "windows"

[dependencies]
serialport = "4.5"
# Slint is used under the Slint Royalty-free Desktop, Mobile, and Web Applications License 2.0,
# which requires the AboutSlint widget (Help > About) or the attribution badge (README.md).
slint = { version = "1.18", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    "accessibility",
    "compat-1-2",
] }
anyhow = "1.0"
thiserror = "1.0"
confy = "0.5"
serde = { version = "1.0", features = ["derive"] }

[build-dependencies]
slint-build = "1.18"

[profile.dev]
opt-level = 0              # No optimization.
debug = "line-tables-only"
strip = false              # Keep symbols.
debug-assertions = true
overflow-checks = true
incremental = true         # Faster recompilation.

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 'z'   # Optimize for size.
lto = true        # Enable Link Time Optimization.
codegen-units = 1 # Better optimization.
strip = true      # Strip symbols.
panic = 'abort'   # Smaller panic handler.
