# GitHub Branch Protection Configuration
#
# This file documents the recommended branch protection settings for the B.L.A.S.T. project.
# These settings should be applied manually via GitHub Settings or using the GitHub CLI:
#
# gh api repos/{owner}/{repo}/branches/main/protection \
#   -f required_status_checks='{"strict":true,"contexts":["Build App","Build Firmware"]}' \
#   -f enforce_admins=true \
#   -f required_pull_request_reviews='{"dismiss_stale_reviews":true,"require_code_owner_review":false,"required_approving_review_count":1}' \
#   -f restrictions=null
#
# gh api repos/{owner}/{repo}/branches/develop/protection \
#   -f required_status_checks='{"strict":true,"contexts":["Build App","Build Firmware"]}' \
#   -f enforce_admins=true \
#   -f required_pull_request_reviews='{"dismiss_stale_reviews":true,"require_code_owner_review":false,"required_approving_review_count":1}' \
#   -f restrictions=null

[branch_protection_main]
# Require pull request reviews before merging
require_pull_request_reviews = true
required_approving_review_count = 1
dismiss_stale_reviews = true
require_code_owner_review = false

# Require status checks to pass
require_status_checks = true
strict_status_checks = true
# Required status checks (from CI/CD workflows):
required_status_checks = [
    "Build App / build (ubuntu-latest)",
    "Build App / build (windows-latest)",
    "Build App / build (macos-latest)",
    "Build App / clippy",
    "Build App / fmt",
    "Build Firmware / build",
    "Build Firmware / lint"
]

# Require branches to be up to date before merging
require_branches_up_to_date = true

# Enforce all above restrictions for administrators
enforce_for_administrators = true

# Restrict who can push to matching branches
allow_force_pushes = false
allow_deletions = false

[branch_protection_develop]
# Same settings as main, but might be slightly more relaxed
require_pull_request_reviews = true
required_approving_review_count = 1
dismiss_stale_reviews = true
require_status_checks = true
strict_status_checks = true
require_branches_up_to_date = true
enforce_for_administrators = true
allow_force_pushes = false
allow_deletions = false
